[project]
name = "romeo-mcp"
version = "1.4.0"
description = "Serveur MCP pour le supercalculateur ROMEO (URCA)"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0.0,<3"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["mcp", "hpc", "slurm", "romeo", "scientific-computing"]

[project.urls]
Repository = "https://github.com/Gotman08/romeo-mcp"
Documentation = "https://github.com/Gotman08/romeo-mcp#readme"
Issues = "https://github.com/Gotman08/romeo-mcp/issues"

[project.optional-dependencies]
docs = ["requests>=2.32", "beautifulsoup4>=4.12", "markdownify>=1.2"]

[project.scripts]
romeo-mcp = "romeo_mcp.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["romeo_mcp"]
include-package-data = false

[tool.setuptools.package-data]
romeo_mcp = ["documentation/**/*", "documentation/*"]
