[package]
name = "romeo-tui"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Optional read-only Ratatui dashboard for ROMEO MCP"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.25"

[profile.release]
strip = true
lto = "thin"
