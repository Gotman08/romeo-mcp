name: Verifications

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Installer
        run: python -m pip install -e ".[docs]" build
      - name: Verifier les fichiers et l'historique
        run: python tools/check_privacy.py --history
      - name: Tester sans cluster
        run: python tests/run_all.py
      - name: Construire les distributions
        run: python -m build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: offline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Construire la version
        run: |
          python -m pip install build
          python -m build
          python tools/prepare_release.py --tag "$GITHUB_REF_NAME"
      - name: Publier la release complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "ROMEO MCP $GITHUB_REF_NAME" --notes-file dist/release-notes.md \
            "dist/romeo_mcp-${version}-py3-none-any.whl" \
            "dist/romeo_mcp-${version}.tar.gz" dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
