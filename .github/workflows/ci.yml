name: Verifications

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Installer
        run: python -m pip install -e ".[docs]" build
      - name: Verifier les fichiers et l'historique
        run: python tools/check_privacy.py --history
      - name: Tester sans cluster
        run: python tests/run_all.py
      - name: Construire les distributions
        run: python -m build

  terminal:
    name: Terminal Ratatui (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: '1.88.0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Installer Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt --component clippy
      - name: Verifier le format Rust
        run: cargo +${{ matrix.rust }} fmt --manifest-path terminal/Cargo.toml -- --check
      - name: Tester le lecteur Python sans MCP ni cluster
        run: python tests/test_terminal.py
      - name: Tester le rendu et la navigation
        run: cargo +${{ matrix.rust }} test --locked --manifest-path terminal/Cargo.toml
      - name: Verifier le code Rust
        run: cargo +${{ matrix.rust }} clippy --locked --manifest-path terminal/Cargo.toml --all-targets -- -D warnings
      - name: Construire le binaire facultatif
        run: cargo +${{ matrix.rust }} build --locked --release --manifest-path terminal/Cargo.toml
      - name: Verifier le pont et les quatre vues Ratatui
        shell: bash
        run: |
          for view in overview jobs transfers updates; do
            python -m romeo_mcp tui --demo --snapshot --view "$view"
          done
      - name: Verifier la restauration du terminal et l'arret du lecteur
        if: runner.os == 'Linux'
        run: python tools/check_terminal_session.py --binary terminal/target/release/romeo-tui

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [offline, terminal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Construire la version
        run: |
          python -m pip install build
          python -m build
          python tools/prepare_release.py --tag "$GITHUB_REF_NAME"
      - name: Publier la release complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "ROMEO MCP $GITHUB_REF_NAME" --notes-file dist/release-notes.md \
            "dist/romeo_mcp-${version}-py3-none-any.whl" \
            "dist/romeo_mcp-${version}.tar.gz" dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
